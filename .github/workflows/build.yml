name: Build

on: [push]

env:
  EM_VERSION: 3.1.74
  EM_CACHE_FOLDER: 'emsdk-cache-v4'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk2.0-dev libglew-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libgles2-mesa-dev libegl1-mesa-dev libglu1-mesa-dev libcurl4-openssl-dev libgpiod2 libgpiod-dev
    - name: make
      run: make -j2
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openhsp-linux-x86_64
        path: |
          hsp3dish
          hsp3gp
          hsp3cl
          hspcmp
          hsed

  build-js:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup cache
      id: cache-system-libraries
      uses: actions/cache@v4
      with:
        path: ${{env.EM_CACHE_FOLDER}}
        key: ${{env.EM_VERSION}}-${{ runner.os }}
    - uses: mymindstorm/setup-emsdk@v14
      with:
        version: ${{env.EM_VERSION}}
        actions-cache-folder: ${{env.EM_CACHE_FOLDER}}
    - name: Build hsp3dish.js
      run: |
        make -f  makefile.emscripten -j2
    - name: Build hspcmp.js
      run: |
        cd src/hspcmp
        make -f  makefile.emscripten -j2
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openhsp-js
        path: |
          *.js
          *.wasm
          src/hspcmp/*.js
          src/hspcmp/*.wasm

  build-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04-amd64
            runner: ubuntu-22.04
          - name: ubuntu-22.04-arm64
            runner: ubuntu-22.04-arm
          - name: ubuntu-24.04-amd64
            runner: ubuntu-24.04
          - name: ubuntu-24.04-arm64
            runner: ubuntu-24.04-arm
          - name: ubuntu-26.04-amd64
            runner: ubuntu-26.04
          - name: ubuntu-26.04-arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y devscripts equivs
        sudo mk-build-deps -i -r -t "apt-get -y" debian/control
    - name: Build packages
      run: |
        dpkg-buildpackage -us -uc -b
        mkdir -p deb-artifacts
        cp ../*.deb deb-artifacts/
    - name: Archive .deb packages
      uses: actions/upload-artifact@v4
      with:
        name: openhsp-deb-${{ matrix.name }}
        path: deb-artifacts/*.deb

  build-win32:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build hsp3
      working-directory: src/hsp3
      run: |
        cmd /c vsbuild.bat

    - name: Build hsp3dish
      working-directory: src/hsp3dish
      run: |
        cmd /c vsbuild.bat

    - name: Build hspcmp
      working-directory: src/hspcmp
      run: |
        cmd /c vsbuild.bat

    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openhsp-win32
        path: |
          src/hsp3/Release/**/*
